AWSTemplateFormatVersion: "2010-09-09"
Description: Solitar production foundation resources.

Parameters:
  ProjectName:
    Type: String
    Default: solitar
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod

Resources:
  DeploymentArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DeploymentArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifactsBucket.Arn
              - !Sub "${DeploymentArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  ProjectName:
    Value: !Ref ProjectName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ProjectName"
  Environment:
    Value: !Ref Environment
    Export:
      Name: !Sub "${ProjectName}-${Environment}-Environment"
  DeploymentArtifactsBucketName:
    Value: !Ref DeploymentArtifactsBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ArtifactBucketName"
  DeploymentArtifactsBucketArn:
    Value: !GetAtt DeploymentArtifactsBucket.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ArtifactBucketArn"
